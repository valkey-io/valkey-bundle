name: Verify Templating

on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/bundle-docker-entrypoint.sh"
      - "Dockerfile.template"
      - "apply-templates.sh"
      - "versions.json"
      - ".jq-template.awk"
      - ".template-helper-functions.jq"
  push:
    paths:
      - "**/Dockerfile"
      - "**/bundle-docker-entrypoint.sh"
      - "Dockerfile.template"
      - "apply-templates.sh"
      - "versions.json"
      - ".jq-template.awk"
      - ".template-helper-functions.jq"

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  apply-templates:
    name: Check For Uncommitted Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - name: Apply Templates
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs, compare against the merge base
            git fetch origin ${{ github.base_ref }}
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            changed_files=$(git diff --name-only HEAD~1 HEAD)
          fi

          # Template inputs affect every version: regenerate everything.
          # Otherwise regenerate only the changed versions.
          if printf "%s\n" "$changed_files" | grep -qE "^(Dockerfile\.template|bundle-docker-entrypoint\.sh|apply-templates\.sh|versions\.json|\.jq-template\.awk|\.template-helper-functions\.jq)$"; then
            ./apply-templates.sh
          else
            readarray -t versions < <(printf "%s\n" "$changed_files" | grep -E '(Dockerfile|bundle-docker-entrypoint\.sh)$' | sed 's|/[^/]*$||' | { grep -oE '^([0-9]+\.[0-9]+|unstable)' || true; } | sort -u)

            if [[ ${#versions[@]} -gt 0 ]]; then
              ./apply-templates.sh "${versions[@]}"
            fi
          fi

      - name: Check Git Status
        run: |
          echo "==== GIT STATUS BEGIN ===="
          status="$(git status --short)"
          printf '%s\n' "$status" | cat -A
          echo "==== GIT STATUS END ===="

          git status

          if [ -z "$status" ]; then
            echo "No changes detected."
          else
            echo "Changes detected! Run ./apply-templates.sh and commit the results."
            git diff
            exit 1
          fi
