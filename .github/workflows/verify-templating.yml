name: Verify Templating

on:
  pull_request:
    paths:
      - "**/Dockerfile"
      - "**/bundle-docker-entrypoint.sh"
      - "Dockerfile.template"
      - "apply-templates.sh"
      - "versions.json"
      - ".jq-template.awk"
      - ".template-helper-functions.jq"
  push:
    paths:
      - "**/Dockerfile"
      - "**/bundle-docker-entrypoint.sh"
      - "Dockerfile.template"
      - "apply-templates.sh"
      - "versions.json"
      - ".jq-template.awk"
      - ".template-helper-functions.jq"

permissions:
  contents: read

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

jobs:
  apply-templates:
    name: Check For Uncommitted Changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Regenerate everything: the committed tree must always match the
      # full output of apply-templates.sh, regardless of what changed.
      - name: Apply Templates
        run: ./apply-templates.sh

      - name: Check Git Status
        run: |
          echo "==== GIT STATUS BEGIN ===="
          status="$(git status --short)"
          printf '%s\n' "$status" | cat -A
          echo "==== GIT STATUS END ===="

          git status

          if [ -z "$status" ]; then
            echo "No changes detected."
          else
            echo "Changes detected! Run ./apply-templates.sh and commit the results."
            git diff
            exit 1
          fi
